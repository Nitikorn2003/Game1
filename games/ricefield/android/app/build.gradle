import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Settings that must not be in the public repository: the app id, AdMob app id and upload key.
// Copy release.properties.example to release.properties (ignored by git); see ANDROID.md.
def releaseConfig = new Properties()
def releaseFile = rootProject.file('release.properties')
if (releaseFile.exists()) releaseFile.withReader('UTF-8') { releaseConfig.load(it) }

// Google's sample AdMob app id: the app runs and shows test ads until the real id is set.
def testAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobAppId = releaseConfig.getProperty('admobAppId', testAdmobAppId).trim()
if (!(admobAppId ==~ /ca-app-pub-\d{16}~\d{10}/)) throw new GradleException("admobAppId in release.properties is not an AdMob app id: $admobAppId")

// The id on Google Play is permanent once the app is uploaded, so choose it before the first release.
def appId = releaseConfig.getProperty('applicationId', 'com.game1.ricefield').trim()
if (!(appId ==~ /[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+/)) throw new GradleException("applicationId in release.properties is not a valid package name: $appId")

// The version comes from the game's package.json: 1.2.3 is versionCode 1002003.
def gameVersion = new JsonSlurper().parse(file('../../package.json')).version as String
def parts = gameVersion.tokenize('.').collect { it as int }
if (parts.size() != 3 || parts[1] > 999 || parts[2] > 999) throw new GradleException("package.json version must be major.minor.patch: $gameVersion")
def code = parts[0] * 1_000_000 + parts[1] * 1_000 + parts[2]

def signed = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseConfig.getProperty(it) }

android {
    namespace = "com.game1.ricefield"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Math.max(code, 1)
        versionName gameVersion
        manifestPlaceholders = [admobAppId: admobAppId]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signed) {
            upload {
                storeFile rootProject.file(releaseConfig.getProperty('storeFile'))
                storePassword releaseConfig.getProperty('storePassword')
                keyAlias releaseConfig.getProperty('keyAlias')
                keyPassword releaseConfig.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signed) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Google Play only accepts builds signed with the upload key, and a store build should show real ads.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    if (!releasing) return
    if (!signed) throw new GradleException('Release builds need the upload key: set storeFile, storePassword, keyAlias and keyPassword in android/release.properties (see ANDROID.md).')
    if (admobAppId == testAdmobAppId) logger.warn('This release build uses Google\'s test AdMob app id. Set admobAppId in android/release.properties before uploading it.')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Firebase sign-in is left out of the app.")
}
